[workspace]
authors = ["Jacob Williams <jacobwilliams@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "pepper"
platforms = ["osx-arm64", "linux-64", "linux-aarch64", "osx-64", "win-64"]
version = "0.0.1"

[dependencies]
gfortran = "16.*"
fpm = ">=0.13.0,<0.14"
python = "3.13.*"
ford = ">=7.0"

[tasks]
build = { cmd = "fpm build", description = "Build the library" }
test = { cmd = "fpm test", description = "Build and run all tests (tspice runs serially in the current directory)" }
# Extra arguments are passed to tools/run_tspice.py, e.g.
#   pixi run tspice                 # all families, one job per CPU
#   pixi run tspice -j 4 'spk*'     # families matching F_SPK*
#   pixi run tspice --help
tspice = { cmd = "fpm test tspice --runner 'python tools/run_tspice.py' --", description = "Run the tspice test families in parallel (see tools/run_tspice.py)" }
tspice-list = { cmd = "fpm test tspice --runner 'python tools/run_tspice.py' -- --list", description = "List the tspice test families" }
