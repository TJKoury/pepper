name = "pepper"
version = "0.1.0"
license = "license"
author = "Jacob Williams"
maintainer = "jacobwilliams@users.noreply.github.com"
copyright = "Copyright 2026, Jacob Williams"


[library]
source-dir = "src"
# SPICELIB include files; the test suite (test/) uses them too.
include-dir = ["src/spicelib"]

[build]
auto-executables = true
auto-tests = true
auto-examples = true

[fortran]
# SPICELIB is legacy F77 code (converted to free form): implicit typing and
# external procedures without interfaces. "default" lets the compiler pick
# the source form from the file extension (.f/.F fixed, .f90/.F90 free).
implicit-typing = true
implicit-external = true
source-form = "default"

# Platform selection for SPICELIB and the test suite. The merged platform
# files (*.F90) select their code with these macros: exactly one SPICE_OS_* and
# one SPICE_COMPILER_* must be defined. Combinations NAIF does not ship (e.g.
# Windows + gfortran) use the #else branches, which are NAIF's Unix gfortran
# code. The "platform" feature is applied automatically through the default
# profile (it is also applied with --profile debug/release).
#
# The macros are passed as plain -D flags rather than through
# [preprocess.cpp]: fpm adds -cpp to *every* source file when a cpp
# preprocessor is configured, and running cpp over all the legacy sources is
# not safe (e.g. "/*" in comments). Compilers preprocess .F90 files
# automatically based on the extension, except Intel Fortran on Windows,
# which needs /fpp (its preprocessor is Fortran-aware, so other files are
# safe).
[features]
platform.macos.flags = "-DSPICE_OS_MACOS"
platform.linux.flags = "-DSPICE_OS_LINUX"
platform.windows.flags = "-DSPICE_OS_WINDOWS"
platform.cygwin.flags = "-DSPICE_OS_CYGWIN"
# gfortran >= 10 rejects SPICELIB's argument rank/type mismatches without
# -fallow-argument-mismatch. -frecursive puts all local variables that are not
# saved on the stack (gfortran otherwise makes large local arrays static),
# which is needed for reentrant, thread-safe code.
platform.gfortran.flags = "-DSPICE_COMPILER_GFORTRAN -fallow-argument-mismatch -frecursive"
platform.ifx.flags = "-DSPICE_COMPILER_INTEL"
platform.ifort.flags = "-DSPICE_COMPILER_INTEL"
platform.windows.ifx.flags = "/fpp"
platform.windows.ifort.flags = "/fpp"

[profiles]
default = ["platform"]
