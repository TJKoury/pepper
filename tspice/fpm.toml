# NAIF's test suite for SPICELIB (tspice), run against PEPPER through its
# SPICELIB interface: each program unit uses the library's module
# pepper_legacy (src/legacy/ of the library: a module per subsystem), which has
# SPICELIB's routines with explicit interfaces. A package of its own: its
# F77-style code still calls a few of its own routines with mismatched
# arguments and needs gfortran's -fallow-argument-mismatch, which the library
# does not. Build and run through the pixi tasks (pixi run tspice).
name = "tspice"
version = "0.1.0"
license = "license"

[library]
source-dir = "src"

[build]
auto-executables = false
auto-tests = false
auto-examples = false

[[executable]]
name = "tspice"
source-dir = "app"
main = "tspice.f90"

[dependencies]
pepper = { path = ".." }

[fortran]
implicit-typing = true
implicit-external = true
source-form = "default"

[features]
# No preprocessor directives (plans/preprocessor_plan.md): only compiler options.
platform.gfortran.flags = "-frecursive -fallow-argument-mismatch"
platform.ifx.flags = "-recursive"
platform.ifort.flags = "-recursive"
platform.windows.ifx.flags = "/recursive"
platform.windows.ifort.flags = "/recursive"

[profiles]
default = ["platform"]
