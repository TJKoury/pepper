# NAIF's test suite for SPICELIB (tspice), run against PEPPER through a
# legacy interface: src/legacy/ has SPICELIB's routines as external
# procedures, thin wrappers that call the library with a default instance and
# context (it is not part of the library). A package of its own: its F77-style code passes arguments
# against their declarations (scalar for array, different types for one
# dummy argument) and needs gfortran's -fallow-argument-mismatch, which the
# library does not. Build and run through the pixi tasks (pixi run tspice).
name = "tspice"
version = "0.1.0"
license = "license"

[library]
source-dir = "src"

[build]
auto-executables = false
auto-tests = false
auto-examples = false

[[executable]]
name = "tspice"
source-dir = "app"
main = "tspice.f90"

[dependencies]
pepper = { path = ".." }

[fortran]
implicit-typing = true
implicit-external = true
source-form = "default"

[features]
# No preprocessor directives (preprocessor_plan.md): only compiler options.
platform.gfortran.flags = "-frecursive -fallow-argument-mismatch"

[profiles]
default = ["platform"]
